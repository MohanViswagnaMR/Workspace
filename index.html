<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="A Notion-style workspace stored as plain Markdown files — Local folder or Google Drive." />
    <title>Workspace</title>

    <!-- Progressive Web App -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#120518" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Workspace" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Google Identity Services — pre-loaded so the token client is ready
         before any user gesture; avoids losing the gesture context in async chains -->
    <script src="https://accounts.google.com/gsi/client" async></script>
  </head>
  <body>
    <!-- Boot screen: hidden by React once the workspace mounts -->
    <div id="boot">
      <div class="boot-logo">◧</div>
      <div class="boot-bar"><i></i></div>
      <small>Loading your workspace…</small>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
